<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bandipurSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1E382E"/>
        <stop offset="60%" stop-color="#55443B"/>
        <stop offset="100%" stop-color="#C77B5A"/>
      </linearGradient>
    </defs>
    <rect width="800" height="600" fill="url(#bandipurSky)"/>
    <!-- Distant Himalayan silhouette -->
    <polygon points="400,120 540,260 260,260" fill="#F7F5EF" opacity="0.4"/>
    <!-- 18th Century Newari Terracotta & Timber Mansions lining the slate street -->
    <!-- Left Mansion -->
    <polygon points="0,220 180,180 260,240 0,280" fill="#78351B"/>
    <rect x="0" y="260" width="230" height="340" fill="#C77B5A"/>
    <!-- Carved wooden lattice windows -->
    <rect x="40" y="300" width="45" height="55" fill="#2A1B14" stroke="#D5C9B4" stroke-width="2"/>
    <rect x="130" y="300" width="45" height="55" fill="#2A1B14" stroke="#D5C9B4" stroke-width="2"/>
    <rect x="40" y="400" width="45" height="55" fill="#2A1B14" stroke="#D5C9B4" stroke-width="2"/>
    <rect x="130" y="400" width="45" height="55" fill="#2A1B14" stroke="#D5C9B4" stroke-width="2"/>
    
    <!-- Right Mansion -->
    <polygon points="800,210 620,170 540,230 800,270" fill="#78351B"/>
    <rect x="560" y="250" width="240" height="350" fill="#C77B5A"/>
    <rect x="610" y="290" width="45" height="55" fill="#2A1B14" stroke="#D5C9B4" stroke-width="2"/>
    <rect x="700" y="290" width="45" height="55" fill="#2A1B14" stroke="#D5C9B4" stroke-width="2"/>
    
    <!-- Preserved slate flagstone pedestrian boulevard -->
    <polygon points="230,600 560,600 460,340 340,340" fill="#4B5548"/>
    <!-- Stone lines -->
    <line x1="280" y1="520" x2="520" y2="520" stroke="#374135" stroke-width="3"/>
    <line x1="310" y1="440" x2="490" y2="440" stroke="#374135" stroke-width="2"/>
    <line x1="330" y1="380" x2="470" y2="380" stroke="#374135" stroke-width="2"/>
    <!-- Warm glowing brass lantern -->
    <line x1="230" y1="380" x2="255" y2="395" stroke="#173D32" stroke-width="3"/>
    <circle cx="255" cy="405" r="9" fill="#F7F5EF"/>
    <circle cx="255" cy="405" r="5" fill="#FFB91F"/>
  </svg>