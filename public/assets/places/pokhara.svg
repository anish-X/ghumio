<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <defs>
      <linearGradient id="pokharaSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1A2A5E"/>
        <stop offset="45%" stop-color="#F45B18"/>
        <stop offset="70%" stop-color="#FFB91F"/>
        <stop offset="100%" stop-color="#08C5C9"/>
      </linearGradient>
      <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#08C5C9"/>
        <stop offset="50%" stop-color="#1769F5"/>
        <stop offset="100%" stop-color="#101D45"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#pokharaSky)"/>
    <!-- Distant Annapurna / Machhapuchhre Fishtail Peak -->
    <polygon points="400,90 480,240 320,240" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="400,90 415,240 385,240" fill="#E8EAF0"/>
    <polygon points="250,140 350,260 150,260" fill="#FFFFFF" opacity="0.85"/>
    <polygon points="550,130 660,260 440,260" fill="#FFFFFF" opacity="0.85"/>
    <!-- Green hills -->
    <path d="M0,260 Q200,200 400,240 T800,220 L800,320 L0,320 Z" fill="#1C3829" opacity="0.85"/>
    <path d="M0,290 Q250,250 550,280 T800,270 L800,340 L0,340 Z" fill="#13271D"/>
    <!-- Fewa Lake -->
    <rect y="330" width="800" height="170" fill="url(#lakeWater)"/>
    <!-- Wooden boat on Fewa Lake -->
    <path d="M480,390 L560,390 L580,410 L460,410 Z" fill="#F45B18"/>
    <polygon points="510,360 550,390 510,390" fill="#FFB91F"/>
    <line x1="510" y1="355" x2="510" y2="400" stroke="#101D45" stroke-width="3"/>
    <!-- Water ripples -->
    <ellipse cx="520" cy="415" rx="70" ry="4" fill="#08C5C9" opacity="0.6"/>
    <ellipse cx="260" cy="430" rx="90" ry="3" fill="#FFFFFF" opacity="0.3"/>
    <ellipse cx="680" cy="450" rx="80" ry="3" fill="#FFFFFF" opacity="0.2"/>
  </svg>