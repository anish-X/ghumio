<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
      <linearGradient id="storyAtmosphere" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#122B23"/>
        <stop offset="40%" stop-color="#24473C"/>
        <stop offset="80%" stop-color="#4F7162"/>
        <stop offset="100%" stop-color="#E8DFD0"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#storyAtmosphere)"/>
    <!-- Majestic Dhaulagiri peak catching warm dawn amber -->
    <polygon points="620,110 880,480 360,480" fill="#FFFDF8"/>
    <polygon points="620,110 680,480 620,480" fill="#C77B5A" opacity="0.6"/>
    <!-- Rolling mountain fog and cloud oceans -->
    <ellipse cx="600" cy="540" rx="650" ry="90" fill="#F7F5EF" opacity="0.8"/>
    <ellipse cx="300" cy="580" rx="380" ry="80" fill="#E8DFD0" opacity="0.9"/>
    <ellipse cx="900" cy="570" rx="380" ry="80" fill="#E8DFD0" opacity="0.9"/>
    <!-- Solitary Gurung stone teahouse with chimney smoke -->
    <rect x="520" y="620" width="160" height="110" fill="#2C3D34" rx="4"/>
    <polygon points="500,620 600,560 700,620" fill="#78351B"/>
    <rect x="580" y="660" width="30" height="70" fill="#E8DFD0"/>
    <rect x="630" y="650" width="30" height="35" fill="#FFB91F" opacity="0.9"/>
    <!-- Gentle wisps of woodsmoke curling into mountain air -->
    <path d="M540,550 Q530,510 550,470 T535,420" stroke="#F7F5EF" stroke-width="2.5" fill="none" opacity="0.5"/>
  </svg>