<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <defs>
      <linearGradient id="mustangSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0F2B5C"/>
        <stop offset="70%" stop-color="#2563EB"/>
        <stop offset="100%" stop-color="#93C5FD"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#mustangSky)"/>
    <!-- Snow peak of Nilgiri in backdrop -->
    <polygon points="400,60 560,250 240,250" fill="#FFFFFF"/>
    <!-- Ochre and red wind-carved desert canyon cliffs -->
    <polygon points="100,160 300,360 0,360" fill="#C2410C"/>
    <polygon points="520,150 780,360 380,360" fill="#9A3412"/>
    <polygon points="260,200 480,380 120,380" fill="#EA580C"/>
    <!-- Ancient Walled Citadel of Lo Manthang & Sky Caves -->
    <rect x="200" y="330" width="400" height="170" fill="#7C2D12"/>
    <!-- White washed Tibetan chorten / stupa -->
    <rect x="380" y="300" width="40" height="35" fill="#FFFFFF" rx="2"/>
    <polygon points="370,300 400,270 430,300" fill="#FFB91F"/>
    <circle cx="400" cy="265" r="4" fill="#DC2626"/>
    <!-- Fortress windows & red clay towers -->
    <rect x="230" y="350" width="15" height="20" fill="#431407"/>
    <rect x="280" y="350" width="15" height="20" fill="#431407"/>
    <rect x="490" y="350" width="15" height="20" fill="#431407"/>
    <rect x="540" y="350" width="15" height="20" fill="#431407"/>
  </svg>