<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
      <linearGradient id="mardiSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0E211B"/>
        <stop offset="70%" stop-color="#1E3E33"/>
        <stop offset="100%" stop-color="#F7F5EF"/>
      </linearGradient>
    </defs>
    <rect width="800" height="600" fill="url(#mardiSky)"/>
    <!-- Holy Machhapuchhre (Fishtail) close up -->
    <polygon points="400,70 560,340 240,340" fill="#F7F5EF"/>
    <polygon points="400,70 435,340 400,340" fill="#D5C9B4"/>
    <polygon points="420,130 500,300 380,300" fill="#FFFFFF"/>
    <!-- Razor narrow alpine grassy ridge leading into clouds -->
    <path d="M0,480 Q220,380 400,340 Q580,380 800,480 L800,600 L0,600 Z" fill="#243B30"/>
    <polygon points="390,340 410,340 450,600 350,600" fill="#4B6353"/>
    <!-- Cloud inversions in valleys on both sides -->
    <ellipse cx="140" cy="430" rx="160" ry="35" fill="#E8DFD0" opacity="0.65"/>
    <ellipse cx="660" cy="420" rx="170" ry="35" fill="#E8DFD0" opacity="0.65"/>
    <!-- Solo trekker on ridge path -->
    <ellipse cx="400" cy="328" rx="3.5" ry="4.5" fill="#C77B5A"/>
    <rect x="398" y="333" width="4" height="7" fill="#173D32"/>
  </svg>