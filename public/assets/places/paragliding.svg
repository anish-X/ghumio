<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <defs>
      <linearGradient id="paraSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0284C7"/>
        <stop offset="50%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#BAE6FD"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#paraSky)"/>
    <!-- Sarangkot Hills and Fewa Lake below -->
    <path d="M0,350 Q300,280 600,360 T800,320 L800,500 L0,500 Z" fill="#15803D"/>
    <ellipse cx="500" cy="440" rx="220" ry="60" fill="#0284C7"/>
    <!-- Curved Paraglider Wing (Multicolor Brand Colors) -->
    <path d="M250,110 Q400,30 550,110 Q400,75 250,110 Z" fill="#F45B18"/>
    <path d="M300,95 Q400,45 500,95 Q400,75 300,95 Z" fill="#FFB91F"/>
    <path d="M340,85 Q400,55 460,85 Q400,75 340,85 Z" fill="#08C5C9"/>
    <!-- Suspension Lines -->
    <line x1="260" y1="108" x2="400" y2="240" stroke="#101D45" stroke-width="1.5"/>
    <line x1="330" y1="88" x2="400" y2="240" stroke="#101D45" stroke-width="1.5"/>
    <line x1="400" y1="78" x2="400" y2="240" stroke="#101D45" stroke-width="1.5"/>
    <line x1="470" y1="88" x2="400" y2="240" stroke="#101D45" stroke-width="1.5"/>
    <line x1="540" y1="108" x2="400" y2="240" stroke="#101D45" stroke-width="1.5"/>
    <!-- Pilot & Passenger in tandem harness -->
    <ellipse cx="400" cy="245" rx="14" ry="18" fill="#101D45"/>
    <circle cx="395" cy="235" r="7" fill="#F45B18"/>
    <circle cx="405" cy="235" r="7" fill="#FFB91F"/>
    <!-- Selfie Stick / GoPro camera extension -->
    <line x1="400" y1="245" x2="445" y2="210" stroke="#334155" stroke-width="3"/>
    <rect x="442" y="202" width="10" height="10" fill="#DC2626" rx="2"/>
  </svg>