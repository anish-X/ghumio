<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <defs>
      <linearGradient id="busBg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#101D45"/>
        <stop offset="100%" stop-color="#1E3A8A"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#busBg)"/>
    <!-- Mountain Highway Road -->
    <polygon points="0,480 800,480 550,300 250,300" fill="#334155"/>
    <line x1="400" y1="300" x2="400" y2="480" stroke="#FFB91F" stroke-width="4" stroke-dasharray="15 15"/>
    <!-- VIP Sofa Coach -->
    <rect x="180" y="160" width="440" height="190" fill="#FFFFFF" rx="28"/>
    <!-- Top Aerodynamic Spoiler & AC Roof Unit -->
    <rect x="260" y="145" width="220" height="20" fill="#E2E8F0" rx="8"/>
    <path d="M580,165 Q620,180 620,250 L620,320 L580,320 Z" fill="#F45B18"/>
    <!-- Windows tint -->
    <rect x="220" y="180" width="370" height="65" fill="#0F172A" rx="10"/>
    <!-- Reclining Sofa Seat Silhouettes -->
    <rect x="240" y="195" width="22" height="35" fill="#FFB91F" rx="4"/>
    <rect x="280" y="195" width="22" height="35" fill="#FFB91F" rx="4"/>
    <rect x="320" y="195" width="22" height="35" fill="#FFB91F" rx="4"/>
    <rect x="360" y="195" width="22" height="35" fill="#FFB91F" rx="4"/>
    <rect x="400" y="195" width="22" height="35" fill="#FFB91F" rx="4"/>
    <rect x="440" y="195" width="22" height="35" fill="#FFB91F" rx="4"/>
    <!-- Coach Wheels -->
    <circle cx="260" cy="355" r="38" fill="#1E293B"/>
    <circle cx="260" cy="355" r="18" fill="#94A3B8"/>
    <circle cx="530" cy="355" r="38" fill="#1E293B"/>
    <circle cx="530" cy="355" r="18" fill="#94A3B8"/>
    <!-- Operator Brand Text Graphic on bus -->
    <text x="240" y="295" font-family="sans-serif" font-weight="900" font-size="24" fill="#101D45">GHUMIO VIP SOFA</text>
    <text x="240" y="318" font-family="sans-serif" font-weight="700" font-size="12" fill="#F45B18">KATHMANDU ⇄ POKHARA DIRECT</text>
  </svg>